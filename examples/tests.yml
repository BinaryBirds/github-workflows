name: Tests

on:
  pull_request:
    branches:
    - main

jobs:

  swiftlang_checks:
    name: Swiftlang Checks
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@main
    with:
      license_header_check_project_name: "project"
      format_check_enabled : true
      broken_symlink_check_enabled : true
      unacceptable_language_check_enabled : true
      shell_check_enabled : true
      docs_check_enabled : true
      api_breakage_check_enabled : true
      license_header_check_enabled : false
      yamllint_check_enabled : false
      python_lint_check_enabled : false

  # For smaller projects, we recommend running tests using swiftlang/github-workflows
  swiftlang_tests:
    name: Swiftlang Tests
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@main
    with:
      enable_windows_checks : false
      macos_xcode_versions: '["swift_6.3", "swift_6.4"]'
      linux_swift_versions: '["6.3", "6.4"]'
      linux_build_command: "swift test --parallel --enable-code-coverage"

  # For larger projects, we recommend running tests with caching enabled
  bb_checks:
    name: BB Checks
    uses: BinaryBirds/github-workflows/.github/workflows/extra_soundness.yml@main
    with:
      local_swift_dependencies_check_enabled : true
      run_tests_with_cache_enabled : true
      tests_cache_enabled : true
      headers_check_enabled : true
      run_tests_swift_versions: '["6.3","6.4"]'
